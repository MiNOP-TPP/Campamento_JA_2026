<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        rgba(0,0,0,.55),
        rgba(0,0,0,.85)
    ),
    url('img/campamento.jpeg');

    background-size:cover;
    background-position:center;

    color:white;
}

.container{

    width:90%;
    max-width:800px;

    padding:50px;

    text-align:center;

    border-radius:35px;

    background:
        rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
        0 25px 60px rgba(0,0,0,.35);
}

.badge{

    display:inline-block;

    padding:10px 20px;

    border-radius:50px;

    background:
        rgba(255,215,0,.15);

    border:
        1px solid rgba(255,215,0,.25);

    color:#FFD700;

    font-weight:700;

    margin-bottom:20px;
}

h1{

    font-size:2.8rem;

    color:#FFD700;

    margin-bottom:10px;
}

.subtitle{

    color:#e2e8f0;

    margin-bottom:35px;

    line-height:1.8;
}

.form-group{

    text-align:left;

    margin-bottom:25px;
}

label{

    display:block;

    margin-bottom:10px;

    font-weight:600;
}

select{

    width:100%;

    padding:15px;

    border:none;

    border-radius:15px;

    font-size:16px;

    outline:none;
}

.resumen{

    display:none;

    margin-top:20px;

    padding:15px;

    border-radius:15px;

    background:
        rgba(255,255,255,.08);

    color:#FFD700;

    font-weight:600;
}

.buttons{

    margin-top:30px;

    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{

    border:none;

    text-decoration:none;

    padding:16px 30px;

    border-radius:60px;

    color:white;

    font-weight:700;

    cursor:pointer;

    transition:.3s ease;
}

.btn:hover{

    transform:
        translateY(-5px)
        scale(1.03);
}

.btn-upload{

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        );
}

.btn-home{

    background:
        linear-gradient(
            135deg,
            #f59e0b,
            #ea580c
        );
}

@media(max-width:768px){

    .container{
        padding:30px;
    }

    h1{
        font-size:2rem;
    }

    .buttons{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }
}

</style>

const zona = document.getElementById("zona");
const dm = document.getElementById("dm");

zona.addEventListener("change", function(){

    dm.innerHTML = "";

    const zonaSeleccionada = this.value;

    if(!zonaSeleccionada){

        dm.innerHTML =
        '<option value="">Primero seleccione una zona</option>';

        return;

    }

    dm.innerHTML =
    '<option value="">Seleccione un Distrito Misionero</option>';

    dms[zonaSeleccionada].forEach(function(item){

        const option =
            document.createElement("option");

        option.value = item;
        option.textContent = item;

        dm.appendChild(option);

    });

});

dm.addEventListener("change", function(){

    if(this.value){

        resumen.style.display = "block";

        resumen.innerHTML =
        "<strong>Zona:</strong> "
        + zona.options[zona.selectedIndex].text +
        "<br><strong>DM:</strong> "
        + this.value;

    }

});

document
.getElementById("btnVoucher")
.addEventListener("click", function(){

    const dm =
        document.getElementById("dm").value;

    if(!dm){

        alert(
            "Seleccione un Distrito Misionero."
        );

        return;
    }

    if(!enlacesDM[dm]){

        alert(
            "Aún no existe un enlace configurado para este DM."
        );

        return;
    }

    window.open(
        enlacesDM[dm],
        "_blank"
    );

});


</script>
